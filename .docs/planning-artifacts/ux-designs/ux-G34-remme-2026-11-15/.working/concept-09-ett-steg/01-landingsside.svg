<title>Konsept 09, landingsside og input, steg 2 av 3</title>
<rect x="0" y="0" width="1440" height="1420" rx="0" fill="#F3F0E8"/>
<rect x="0" y="0" width="1440" height="72" rx="0" fill="#FCFBF7"/>
<line x1="0" y1="72" x2="1440" y2="72" stroke="#DCD6CA" stroke-width="1"/>
<text x="120" y="44" font-family="Charter, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="22" fill="#1E2A2F" font-weight="600" text-anchor="start">CV-assistenten</text>
<text x="296" y="44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#4B575B" font-weight="400" text-anchor="start">for deg som søker første jobb</text>
<text x="1320" y="44" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#4B575B" font-weight="400" text-anchor="end">Ingen innlogging</text>
<text x="400" y="160" font-family="Charter, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="44" fill="#1E2A2F" font-weight="500" text-anchor="start">Se hvor godt CV-en din treffer</text>
<text x="400" y="214" font-family="Charter, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="44" fill="#1E2A2F" font-weight="500" text-anchor="start">akkurat denne annonsen.</text>
<text x="400" y="264" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#4B575B" font-weight="400" text-anchor="start">Lim inn CV-en og én trainee-annonse. Du får en match-score og en</text>
<text x="400" y="292" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#4B575B" font-weight="400" text-anchor="start">rolig gjennomgang av kravene, ett steg om gangen.</text>
<path d="M403 331 L407.2 335.2 L415 326.8" fill="none" stroke="#2E5A60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="430" y="336" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1E2A2F" font-weight="700" text-anchor="start">Sitater som bevis.</text>
<text x="626" y="336" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#4B575B" font-weight="400" text-anchor="start">Hvert treff viser ordrett hvor i CV-en det står.</text>
<path d="M403 365 L407.2 369.2 L415 360.8" fill="none" stroke="#2E5A60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="430" y="370" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1E2A2F" font-weight="700" text-anchor="start">Aldri finn på erfaring.</text>
<text x="626" y="370" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#4B575B" font-weight="400" text-anchor="start">Hintene peker bare på det du allerede har skrevet.</text>
<path d="M403 399 L407.2 403.2 L415 394.8" fill="none" stroke="#2E5A60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="430" y="404" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1E2A2F" font-weight="700" text-anchor="start">Det positive først.</text>
<text x="626" y="404" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#4B575B" font-weight="400" text-anchor="start">Du ser hva som er bra, før det som kan bli tydeligere.</text>
<line x1="546" y1="482" x2="694" y2="482" stroke="#2E5A60" stroke-width="2"/>
<line x1="746" y1="482" x2="894" y2="482" stroke="#DCD6CA" stroke-width="2"/>

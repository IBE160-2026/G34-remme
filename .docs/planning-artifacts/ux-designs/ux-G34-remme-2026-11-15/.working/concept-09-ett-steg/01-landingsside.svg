<text x="720" y="532" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#2E5A60" font-weight="700" text-anchor="middle">Annonse</text>
<circle cx="920" cy="482" r="20" fill="#FCFBF7" stroke="#A9A396" stroke-width="1.5"/>
<text x="920" y="488" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#4B575B" font-weight="600" text-anchor="middle">3</text>
<text x="920" y="532" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#4B575B" font-weight="500" text-anchor="middle">Analyser</text>
<rect x="360" y="578" width="720" height="700" rx="18" fill="#FCFBF7" stroke="#DCD6CA" stroke-width="1"/>
<rect x="400" y="610" width="640" height="96" rx="12" fill="#FCFBF7" stroke="#DCD6CA" stroke-width="1"/>
<circle cx="436" cy="644" r="14" fill="#2E5A60"/>
<path d="M430.5 644 L434.35 647.85 L441.5 640.15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="464" y="650" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1E2A2F" font-weight="600" text-anchor="start">Lim inn CV her:</text>
<text x="464" y="680" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#4B575B" font-weight="400" text-anchor="start">Yvonne Berg · Bachelor i IT og informasjonssystemer, Høgskolen …</text>
<text x="920" y="650" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#4B575B" font-weight="400" text-anchor="end">357 / 15 000 tegn</text>
<rect x="936" y="630" width="80" height="36" rx="8" fill="none" stroke="#2E5A60" stroke-width="1.5"/>
<text x="976" y="653" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#2E5A60" font-weight="600" text-anchor="middle">Endre</text>
<circle cx="414" cy="750" r="14" fill="#FCFBF7" stroke="#2E5A60" stroke-width="2"/>
<text x="414" y="755" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2E5A60" font-weight="700" text-anchor="middle">2</text>
<text x="440" y="757" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#1E2A2F" font-weight="600" text-anchor="start">Lim inn annonse her:</text>

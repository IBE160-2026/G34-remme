<text x="420" y="810" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5F686B" font-weight="400" text-anchor="start">Lim inn hele teksten fra én stillingsannonse.</text>
<text x="1040" y="1002" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#4B575B" font-weight="400" text-anchor="end">0 / 15 000 tegn</text>
<circle cx="410" cy="1025" r="9" fill="none" stroke="#4B575B" stroke-width="1.6"/><line x1="410" y1="1024" x2="410" y2="1029.5" stroke="#4B575B" stroke-width="1.8"/><circle cx="410" cy="1020.5" r="1.2" fill="#4B575B"/>
<text x="430" y="1030" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#4B575B" font-weight="400" text-anchor="start">Bare en CV og en annonse per analyse</text>
<rect x="400" y="1052" width="640" height="52" rx="10" fill="#DDE7E6"/>
<path d="M422 1075 V1072 a5 5 0 0 1 10 0 V1075" fill="none" stroke="#2E5A60" stroke-width="1.6"/><rect x="419" y="1075" width="16" height="11" rx="2.5" fill="none" stroke="#2E5A60" stroke-width="1.6"/><circle cx="427" cy="1080.5" r="1.6" fill="#2E5A60"/>
<text x="448" y="1084" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1E2A2F" font-weight="500" text-anchor="start">CV-en din sendes til Claude for analyse. Appen lagrer den ikke.</text>
<rect x="400" y="1132" width="640" height="64" rx="12" fill="#E2DED4" stroke="#CFC9BC" stroke-width="1" stroke-dasharray="6 4"/>
<text x="720.0" y="1171.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#5C6062" font-weight="600" text-anchor="middle">Analyser</text>
<text x="720.0" y="1226" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#4B575B" font-weight="400" text-anchor="middle">«Analyser» blir aktiv når både CV og annonse er limt inn.</text>
<text x="1124" y="618" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1E2A2F" font-weight="700" text-anchor="start">Knappens to tilstander</text>
<rect x="1124" y="638" width="196" height="52" rx="12" fill="#E2DED4" stroke="#CFC9BC" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1222.0" y="671.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#5C6062" font-weight="600" text-anchor="middle">Analyser</text>
<text x="1124" y="714" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#4B575B" font-weight="400" text-anchor="start">Deaktivert: et felt er tomt</text>
<text x="1124" y="734" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#4B575B" font-weight="400" text-anchor="start">eller bare mellomrom.</text>
<rect x="1124" y="763" width="196" height="52" rx="12" fill="#1E3F44" opacity="0.18"/>
<rect x="1124" y="760" width="196" height="52" rx="12" fill="#2E5A60"/>
<text x="1222.0" y="793.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">Analyser</text>
<text x="1124" y="836" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#4B575B" font-weight="400" text-anchor="start">Aktiv: begge feltene har</text>
<text x="1124" y="856" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#4B575B" font-weight="400" text-anchor="start">tekst, maks 15 000 tegn hver.</text>

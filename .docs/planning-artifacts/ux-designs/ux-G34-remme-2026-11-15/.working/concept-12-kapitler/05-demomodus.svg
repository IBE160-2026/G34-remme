<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1970" viewBox="0 0 1440 1970" role="img" lang="nb"><title>Konsept 12 Kapitler – demomodus</title><desc>Inputsiden etter Bruk eksempel, og resultatsidens oversikt merket som eksempeldata.</desc><style>.f{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif}.s{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}</style><rect x="0.0" y="0.0" width="1440.0" height="1970.0" fill="#F6F1E9"/><text x="120.0" y="46.0" class="f" font-size="24" fill="#2A2420">CV-assistenten</text><text x="292.2" y="45.0" class="s" font-size="14" fill="#5E544B">en kort gjennomgang av CV-en din</text><text x="1320.0" y="45.0" class="s" font-size="14" fill="#5E544B" text-anchor="end">Ingen innlogging</text><line x1="120.0" y1="72.0" x2="1320.0" y2="72.0" stroke="#D4C9BA" stroke-width="1"/><rect x="0.0" y="73.0" width="1440.0" height="46.0" fill="#EFE4CC"/><line x1="0.0" y1="119.0" x2="1440.0" y2="119.0" stroke="#D4C9BA" stroke-width="1"/><g fill="none" stroke="#2A2420" stroke-width="1.5" stroke-linecap="round"><circle cx="132" cy="96" r="8"/><path d="M132 95 V100"/></g><circle cx="132" cy="92" r="1.1" fill="#2A2420"/><text x="150.0" y="101.0" class="s" font-size="15" fill="#2A2420" font-weight="600">Demomodus – ingen API-nøkkel funnet</text><text x="1320.0" y="101.0" class="s" font-size="14" fill="#2A2420" text-anchor="end">Slik legger du inn en egen nøkkel: se README</text><text x="120.0" y="198.0" class="f" font-size="50" fill="#2A2420">Se hvor godt</text><text x="120.0" y="256.0" class="f" font-size="50" fill="#2A2420">CV-en din treffer</text><text x="120.0" y="314.0" class="f" font-size="50" fill="#2A2420">annonsen.</text><text x="120.0" y="374.0" class="s" font-size="18" fill="#2A2420">Lim inn CV-en din og én stillingsannonse. Du får en</text><text x="120.0" y="403.0" class="s" font-size="18" fill="#2A2420">match-score og en kort gjennomgang i tre kapitler,</text><text x="120.0" y="432.0" class="s" font-size="18" fill="#2A2420">ett om gangen.</text><line x1="120.0" y1="471.0" x2="520.0" y2="471.0" stroke="#D4C9BA" stroke-width="1"/><text x="120.0" y="515.0" class="f" font-size="24" fill="#2A2420">Forord</text><text x="120.0" y="547.0" class="s" font-size="15" fill="#5E544B">Hvert treff har et sitat fra CV-en som bevis, og koden sjekker</text><text x="120.0" y="571.0" class="s" font-size="15" fill="#5E544B">at sitatet står der ordrett. Hintene peker bare på det du</text><text x="120.0" y="595.0" class="s" font-size="15" fill="#5E544B">allerede har skrevet. Ingen erfaring blir funnet på.</text><text x="120.0" y="641.0" class="f" font-size="17" fill="#2A2420">Innhold i gjennomgangen</text><line x1="120.0" y1="655.0" x2="520.0" y2="655.0" stroke="#2A2420" stroke-width="1"/><text x="120.0" y="689.0" class="s" font-size="15" fill="#2A2420">Oversikt</text><line x1="181.0" y1="685.0" x2="435.8" y2="685.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="689.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">match-score</text><text x="120.0" y="725.0" class="f" font-size="15" fill="#5E544B">1</text><text x="142.0" y="725.0" class="s" font-size="15" fill="#2A2420">Dette er bra</text><line x1="227.8" y1="721.0" x2="473.5" y2="721.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="725.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">truffet</text><text x="120.0" y="761.0" class="f" font-size="15" fill="#5E544B">2</text><text x="142.0" y="761.0" class="s" font-size="15" fill="#2A2420">Dette kan bli tydeligere</text><line x1="302.7" y1="757.0" x2="433.8" y2="757.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="761.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">delvis truffet</text><text x="120.0" y="797.0" class="f" font-size="15" fill="#5E544B">3</text><text x="142.0" y="797.0" class="s" font-size="15" fill="#2A2420">Dette mangler</text><line x1="243.8" y1="793.0" x2="459.5" y2="793.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="797.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">mangler</text><text x="640.0" y="206.0" class="f" font-size="30" fill="#2A2420">Din CV og annonsen</text><g fill="none" stroke="#5E544B" stroke-width="1.5" stroke-linecap="round"><circle cx="649" cy="238" r="8"/><path d="M649 237 V242"/></g><circle cx="649" cy="234" r="1.1" fill="#5E544B"/><text x="666.0" y="243.0" class="s" font-size="15" fill="#5E544B">Bare en CV og en annonse per analyse</text><text x="640.0" y="290.0" class="s" font-size="15" fill="#2A2420">Ingen nøkkel? Se hele flyten med ferdige eksempeldata.</text><rect x="640.0" y="306.0" width="680.0" height="50.0" fill="#FFFDF9" stroke="#2A2420" stroke-width="1.25" rx="3"/><g fill="none" stroke="#2A2420" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><rect x="913.04375" y="324.0" width="13" height="15" rx="1.5"/><path d="M917.04375 324.0 V322.0 H922.04375 V324.0"/><path d="M916.54375 331.0 H922.54375 M920.04375 328.5 L922.54375 331.0 L920.04375 333.5"/></g><text x="939.0" y="336.6" class="s" font-size="16" fill="#2A2420" font-weight="600">Bruk eksempel</text><line x1="640.0" y1="384.0" x2="1320.0" y2="384.0" stroke="#D4C9BA" stroke-width="1"/><line x1="640.0" y1="460.0" x2="1320.0" y2="460.0" stroke="#D4C9BA" stroke-width="1"/><circle cx="651" cy="422" r="11" fill="#2A2420"/><path d="M647.0 422.5 l3.0 3.0 l5.5 -6.5" fill="none" stroke="#FFFDF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="674.0" y="416.0" class="f" font-size="15" fill="#5E544B">Del 1</text><text x="718.8" y="416.0" class="s" font-size="16" fill="#2A2420" font-weight="600">Lim inn CV her:</text><rect x="842.1" y="400.0" width="96.2" height="22.0" fill="#EFE4CC" rx="11"/><text x="849.1" y="415.5" class="s" font-size="13" fill="#2A2420" font-weight="600">Eksempeldata</text><text x="1206.0" y="416.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">357 / 15 000 tegn</text><text x="718.8" y="440.0" class="s" font-size="15" fill="#5E544B">Yvonne Berg · Bachelor i IT og informasjonssystemer, Høgskolen i Molde</text><rect x="1234.0" y="404.0" width="86.0" height="36.0" fill="#FFFDF9" stroke="#2A2420" stroke-width="1.25" rx="3"/><text x="1257.5" y="427.2" class="s" font-size="15" fill="#2A2420" font-weight="600">Endre</text><line x1="640.0" y1="460.0" x2="1320.0" y2="460.0" stroke="#D4C9BA" stroke-width="1"/><line x1="640.0" y1="536.0" x2="1320.0" y2="536.0" stroke="#D4C9BA" stroke-width="1"/><circle cx="651" cy="498" r="11" fill="#2A2420"/><path d="M647.0 498.5 l3.0 3.0 l5.5 -6.5" fill="none" stroke="#FFFDF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="674.0" y="492.0" class="f" font-size="15" fill="#5E544B">Del 2</text><text x="720.8" y="492.0" class="s" font-size="16" fill="#2A2420" font-weight="600">Lim inn annonse her:</text><rect x="885.3" y="476.0" width="96.2" height="22.0" fill="#EFE4CC" rx="11"/><text x="892.3" y="491.5" class="s" font-size="13" fill="#2A2420" font-weight="600">Eksempeldata</text><text x="1206.0" y="492.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">426 / 15 000 tegn</text><text x="720.8" y="516.0" class="s" font-size="15" fill="#5E544B">Trainee – økonomi og analyse, Nordvik Kraft AS, Ålesund</text><rect x="1234.0" y="480.0" width="86.0" height="36.0" fill="#FFFDF9" stroke="#2A2420" stroke-width="1.25" rx="3"/><text x="1257.5" y="503.2" class="s" font-size="15" fill="#2A2420" font-weight="600">Endre</text><g fill="none" stroke="#2A2420" stroke-width="1.5" stroke-linecap="round"><rect x="640" y="576" width="13" height="10" rx="2"/><path d="M643 576 V573.5 a3.5 3.5 0 0 1 7 0 V576"/></g><text x="664.0" y="584.0" class="s" font-size="15" fill="#2A2420">CV-en din sendes til Claude for analyse. Appen lagrer den ikke.</text><rect x="640.0" y="612.0" width="200.0" height="52.0" fill="#2A2420" rx="3"/><text x="708.7" y="643.6" class="s" font-size="16" fill="#FFFDF9" font-weight="600">Analyser</text><text x="862.0" y="644.0" class="s" font-size="14" fill="#2A2420">Eksempeldataene er fylt inn. «Analyser» viser det ferdige resultatet.</text><line x1="120.0" y1="880.0" x2="1320.0" y2="880.0" stroke="#D4C9BA" stroke-width="1"/><text x="120.0" y="908.0" class="s" font-size="13" fill="#5E544B">Laget av gruppe G34, IBE160</text><text x="1320.0" y="908.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">Ingen innlogging. CV og annonse lagres ikke.</text><rect x="0.0" y="940.0" width="1440.0" height="76.0" fill="#E9EEF2"/><text x="120.0" y="974.0" class="s" font-size="15" fill="#3E5468" font-weight="600">Resultatsiden i demomodus</text><text x="120.0" y="996.0" class="s" font-size="14" fill="#3E5468">Samme oppbygning som en ekte analyse, merket som eksempeldata tre steder: båndet, merket over scoren og margteksten.</text><text x="120.0" y="1062.0" class="f" font-size="24" fill="#2A2420">CV-assistenten</text><text x="292.2" y="1061.0" class="s" font-size="14" fill="#5E544B">en kort gjennomgang av CV-en din</text><text x="1320.0" y="1061.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">Trainee – økonomi og analyse · Nordvik Kraft AS</text><line x1="120.0" y1="1088.0" x2="1320.0" y2="1088.0" stroke="#D4C9BA" stroke-width="1"/><rect x="0.0" y="1089.0" width="1440.0" height="46.0" fill="#EFE4CC"/><line x1="0.0" y1="1135.0" x2="1440.0" y2="1135.0" stroke="#D4C9BA" stroke-width="1"/><g fill="none" stroke="#2A2420" stroke-width="1.5" stroke-linecap="round"><circle cx="132" cy="1112" r="8"/><path d="M132 1111 V1116"/></g><circle cx="132" cy="1108" r="1.1" fill="#2A2420"/><text x="150.0" y="1117.0" class="s" font-size="15" fill="#2A2420" font-weight="600">Eksempeldata – dette er et ferdig resultat for en fiktiv CV, ikke din egen tekst.</text><text x="120.0" y="1212.0" class="f" font-size="22" fill="#2A2420">Innhold</text><line x1="120.0" y1="1226.0" x2="370.0" y2="1226.0" stroke="#2A2420" stroke-width="1.25"/><path d="M104 1253 L112 1258.5 L104 1264 Z" fill="#2A2420"/><text x="120.0" y="1264.0" class="s" font-size="15" fill="#2A2420" font-weight="600">Oversikt</text><line x1="184.0" y1="1260.0" x2="332.8" y2="1260.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="370.0" y="1264.0" class="s" font-size="14" fill="#2A2420" text-anchor="end">59 %</text><line x1="120.0" y1="1280.0" x2="370.0" y2="1280.0" stroke="#E6DDD0" stroke-width="1"/><text x="120.0" y="1310.0" class="f" font-size="16" fill="#5E544B">1</text><text x="142.0" y="1310.0" class="s" font-size="15" fill="#2A2420">Dette er bra</text><line x1="227.8" y1="1306.0" x2="326.0" y2="1306.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="370.0" y="1310.0" class="s" font-size="14" fill="#2A2420" text-anchor="end">3 krav</text><line x1="120.0" y1="1326.0" x2="370.0" y2="1326.0" stroke="#E6DDD0" stroke-width="1"/><text x="120.0" y="1356.0" class="f" font-size="16" fill="#5E544B">2</text><text x="142.0" y="1356.0" class="s" font-size="15" fill="#2A2420">Dette kan bli tydeligere</text><line x1="302.7" y1="1352.0" x2="326.0" y2="1352.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="370.0" y="1356.0" class="s" font-size="14" fill="#2A2420" text-anchor="end">2 krav</text><line x1="120.0" y1="1372.0" x2="370.0" y2="1372.0" stroke="#E6DDD0" stroke-width="1"/><text x="120.0" y="1402.0" class="f" font-size="16" fill="#5E544B">3</text><text x="142.0" y="1402.0" class="s" font-size="15" fill="#2A2420">Dette mangler</text><line x1="243.8" y1="1398.0" x2="326.0" y2="1398.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="370.0" y="1402.0" class="s" font-size="14" fill="#2A2420" text-anchor="end">2 krav</text><line x1="120.0" y1="1418.0" x2="370.0" y2="1418.0" stroke="#E6DDD0" stroke-width="1"/><rect x="120.0" y="1458.0" width="250.0" height="44.0" fill="#FFFDF9" stroke="#2A2420" stroke-width="1.25" rx="3"/><g fill="none" stroke="#2A2420" stroke-width="1.5" stroke-linecap="round"><rect x="174.77189453124998" y="1472.0" width="13" height="16" rx="1.5"/><path d="M177.77189453124998 1477.0 H184.77189453124998 M177.77189453124998 1480.5 H184.77189453124998 M177.77189453124998 1484.0 H182.77189453124998"/></g><text x="200.8" y="1485.2" class="s" font-size="15" fill="#2A2420" font-weight="600">Vis alt på én side</text><g fill="none" stroke="#2A2420" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M136 1534 H124"/><path d="M129 1529 L124 1534 L129 1539"/></g><text x="146.0" y="1539.0" class="s" font-size="15" fill="#2A2420">Endre CV eller annonse</text><line x1="146.0" y1="1543.0" x2="298.5" y2="1543.0" stroke="#D4C9BA" stroke-width="1"/><rect x="420.0" y="1242.0" width="98.2" height="24.0" fill="#EFE4CC" rx="12"/><text x="428.0" y="1259.0" class="s" font-size="13" fill="#2A2420" font-weight="600">Eksempeldata</text><text x="420.0" y="1332.0" class="f" font-size="68" fill="#2A2420">Du er på 59 %.</text><text x="420.0" y="1382.0" class="f" font-size="23" fill="#5E544B">Fikser du de 2 delvis truffede kravene, kan du</text><text x="420.0" y="1414.0" class="f" font-size="23" fill="#5E544B">nå 73 %.</text><text x="420.0" y="1450.0" class="s" font-size="14" fill="#5E544B">Match-score 59 %. Potensiell score 73 %. Krav som mangler, telles ikke med</text><text x="420.0" y="1471.0" class="s" font-size="14" fill="#5E544B">i den potensielle scoren.</text><rect x="420.0" y="1510.0" width="79.3" height="16.0" fill="#4A6536"/><rect x="503.3" y="1510.0" width="79.3" height="16.0" fill="#4A6536"/><rect x="586.5" y="1510.0" width="39.6" height="16.0" fill="#4A6536"/><rect x="630.9" y="1510.8" width="77.8" height="14.5" fill="#FFFDF9" stroke="#7A5710" stroke-width="1.5"/><rect x="630.2" y="1510.0" width="39.6" height="16.0" fill="#7A5710"/><rect x="714.2" y="1510.8" width="38.1" height="14.5" fill="#FFFDF9" stroke="#7A5710" stroke-width="1.5"/><rect x="713.5" y="1510.0" width="19.8" height="16.0" fill="#7A5710"/><rect x="757.8" y="1510.8" width="77.8" height="14.5" fill="none" stroke="#8A3B2B" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="841.1" y="1510.8" width="38.1" height="14.5" fill="none" stroke="#8A3B2B" stroke-width="1.5" stroke-dasharray="4 3"/><text x="420.0" y="1552.0" class="s" font-size="14" fill="#5E544B">6,5 av 11 poeng. Hver bit er ett krav. Må-krav er dobbelt så brede fordi de</text><text x="420.0" y="1573.0" class="s" font-size="14" fill="#5E544B">teller dobbelt.</text><circle cx="427" cy="1597" r="6.5" fill="#4A6536"/><text x="440.0" y="1602.0" class="s" font-size="14" fill="#5E544B">truffet</text><circle cx="507.5" cy="1597" r="5.75" fill="#FFFDF9" stroke="#7A5710" stroke-width="1.5"/><path d="M507.5 1591.25 A5.75 5.75 0 0 0 507.5 1602.75 Z" fill="#7A5710"/><text x="520.5" y="1602.0" class="s" font-size="14" fill="#5E544B">delvis truffet</text><circle cx="627.0" cy="1597" r="5.75" fill="none" stroke="#8A3B2B" stroke-width="1.5"/><text x="640.0" y="1602.0" class="s" font-size="14" fill="#5E544B">mangler</text><text x="420.0" y="1652.0" class="s" font-size="17" fill="#2A2420">Annonsen har 7 krav. 3 er truffet, 2 er delvis truffet, og 2</text><text x="420.0" y="1679.0" class="s" font-size="17" fill="#2A2420">mangler. Erfaringen din finnes i CV-en, men flere steder er</text><text x="420.0" y="1706.0" class="s" font-size="17" fill="#2A2420">den ikke formulert opp mot annonsen. Gjennomgangen tar</text><text x="420.0" y="1733.0" class="s" font-size="17" fill="#2A2420">ett kapittel om gangen, og det som er bra, kommer først.</text><line x1="930.0" y1="1282.0" x2="1320.0" y2="1282.0" stroke="#D4C9BA" stroke-width="1"/><text x="930.0" y="1312.0" class="f" font-size="17" fill="#2A2420">Slik er scoren regnet</text><text x="930.0" y="1338.0" class="s" font-size="14" fill="#5E544B">Må-krav gir 2 poeng når de er truffet og 1 når de er delvis</text><text x="930.0" y="1359.0" class="s" font-size="14" fill="#5E544B">truffet. Bør-krav gir 1 og 0,5. Krav som mangler, gir 0.</text><text x="930.0" y="1384.0" class="s" font-size="14" fill="#2A2420">6,5 ÷ 11 × 100 = 59,1 %, vist som 59 %.</text><line x1="930.0" y1="1430.0" x2="1320.0" y2="1430.0" stroke="#D4C9BA" stroke-width="1"/><text x="930.0" y="1460.0" class="f" font-size="17" fill="#2A2420">Sitatkontrollen</text><text x="930.0" y="1486.0" class="s" font-size="14" fill="#5E544B">1 krav ble nedgradert fordi sitatet ikke fantes ordrett i CV-en.</text><text x="930.0" y="1507.0" class="s" font-size="14" fill="#5E544B">Du finner det i kapittel 3.</text><line x1="420.0" y1="1800.0" x2="1320.0" y2="1800.0" stroke="#D4C9BA" stroke-width="1"/><text x="870.0" y="1860.0" class="f" font-size="15" fill="#5E544B" font-style="italic" text-anchor="middle">Oversikt · side 1 av 4</text><rect x="1000.0" y="1828.0" width="320.0" height="52.0" fill="#2A2420" rx="3"/><text x="1047.6" y="1859.6" class="s" font-size="16" fill="#FFFDF9" font-weight="600">Neste kapittel: Dette er bra</text><g fill="none" stroke="#FFFDF9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1254.425 1854.0 H1267.425"/><path d="M1262.425 1849.0 L1267.425 1854.0 L1262.425 1859.0"/></g><text transform="translate(1372 1252) rotate(90)" class="s" font-size="13" font-weight="600" fill="#2A2420" letter-spacing="2">EKSEMPELDATA · IKKE DIN EGEN TEKST</text><line x1="1358.0" y1="1248.0" x2="1358.0" y2="1880.0" stroke="#2A2420" stroke-width="1"/><line x1="120.0" y1="1920.0" x2="1320.0" y2="1920.0" stroke="#D4C9BA" stroke-width="1"/><text x="120.0" y="1948.0" class="s" font-size="13" fill="#5E544B">Laget av gruppe G34, IBE160</text><text x="1320.0" y="1948.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">Ingen innlogging. CV og annonse lagres ikke.</text></svg>

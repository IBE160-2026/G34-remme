<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" lang="nb"><title>Konsept 12 Kapitler – analyserer</title><desc>Venting: delene er låst, knappen viser Analyserer, og innholdsfortegnelsen venter på sidetall.</desc><style>.f{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif}.s{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}</style><rect x="0.0" y="0.0" width="1440.0" height="1110.0" fill="#F6F1E9"/><text x="120.0" y="46.0" class="f" font-size="24" fill="#2A2420">CV-assistenten</text><text x="292.2" y="45.0" class="s" font-size="14" fill="#5E544B">en kort gjennomgang av CV-en din</text><text x="1320.0" y="45.0" class="s" font-size="14" fill="#5E544B" text-anchor="end">Ingen innlogging</text><line x1="120.0" y1="72.0" x2="1320.0" y2="72.0" stroke="#D4C9BA" stroke-width="1"/><text x="120.0" y="152.0" class="f" font-size="50" fill="#2A2420">Se hvor godt</text><text x="120.0" y="210.0" class="f" font-size="50" fill="#2A2420">CV-en din treffer</text><text x="120.0" y="268.0" class="f" font-size="50" fill="#2A2420">annonsen.</text><text x="120.0" y="328.0" class="s" font-size="18" fill="#2A2420">Lim inn CV-en din og én stillingsannonse. Du får en</text><text x="120.0" y="357.0" class="s" font-size="18" fill="#2A2420">match-score og en kort gjennomgang i tre kapitler,</text><text x="120.0" y="386.0" class="s" font-size="18" fill="#2A2420">ett om gangen.</text><line x1="120.0" y1="425.0" x2="520.0" y2="425.0" stroke="#D4C9BA" stroke-width="1"/><text x="120.0" y="469.0" class="f" font-size="24" fill="#2A2420">Forord</text><text x="120.0" y="501.0" class="s" font-size="15" fill="#5E544B">Hvert treff har et sitat fra CV-en som bevis, og koden sjekker</text><text x="120.0" y="525.0" class="s" font-size="15" fill="#5E544B">at sitatet står der ordrett. Hintene peker bare på det du</text><text x="120.0" y="549.0" class="s" font-size="15" fill="#5E544B">allerede har skrevet. Ingen erfaring blir funnet på.</text><text x="120.0" y="595.0" class="f" font-size="17" fill="#2A2420">Innhold i gjennomgangen</text><line x1="120.0" y1="609.0" x2="520.0" y2="609.0" stroke="#2A2420" stroke-width="1"/><text x="120.0" y="643.0" class="s" font-size="15" fill="#2A2420">Oversikt</text><line x1="181.0" y1="639.0" x2="435.8" y2="639.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="643.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">match-score</text><text x="120.0" y="679.0" class="f" font-size="15" fill="#5E544B">1</text><text x="142.0" y="679.0" class="s" font-size="15" fill="#2A2420">Dette er bra</text><line x1="227.8" y1="675.0" x2="473.5" y2="675.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="679.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">truffet</text><text x="120.0" y="715.0" class="f" font-size="15" fill="#5E544B">2</text><text x="142.0" y="715.0" class="s" font-size="15" fill="#2A2420">Dette kan bli tydeligere</text><line x1="302.7" y1="711.0" x2="433.8" y2="711.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="715.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">delvis truffet</text><text x="120.0" y="751.0" class="f" font-size="15" fill="#5E544B">3</text><text x="142.0" y="751.0" class="s" font-size="15" fill="#2A2420">Dette mangler</text><line x1="243.8" y1="747.0" x2="459.5" y2="747.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="751.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">mangler</text><text x="640.0" y="160.0" class="f" font-size="30" fill="#2A2420">Din CV og annonsen</text><g fill="none" stroke="#5E544B" stroke-width="1.5" stroke-linecap="round"><circle cx="649" cy="192" r="8"/><path d="M649 191 V196"/></g><circle cx="649" cy="188" r="1.1" fill="#5E544B"/><text x="666.0" y="197.0" class="s" font-size="15" fill="#5E544B">Bare en CV og en annonse per analyse</text><line x1="640.0" y1="230.0" x2="1320.0" y2="230.0" stroke="#D4C9BA" stroke-width="1"/><line x1="640.0" y1="306.0" x2="1320.0" y2="306.0" stroke="#D4C9BA" stroke-width="1"/><circle cx="651" cy="268" r="11" fill="#2A2420"/><path d="M647.0 268.5 l3.0 3.0 l5.5 -6.5" fill="none" stroke="#FFFDF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="674.0" y="262.0" class="f" font-size="15" fill="#5E544B">Del 1</text><text x="718.8" y="262.0" class="s" font-size="16" fill="#2A2420" font-weight="600">Lim inn CV her:</text><text x="1206.0" y="262.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">357 / 15 000 tegn</text><text x="718.8" y="286.0" class="s" font-size="15" fill="#5E544B">Yvonne Berg · Bachelor i IT og informasjonssystemer, Høgskolen i Molde</text><rect x="1234.0" y="250.0" width="86.0" height="36.0" fill="#E4DACB" rx="3"/><text x="1257.5" y="273.2" class="s" font-size="15" fill="#62584F" font-weight="600">Endre</text><line x1="640.0" y1="306.0" x2="1320.0" y2="306.0" stroke="#D4C9BA" stroke-width="1"/><line x1="640.0" y1="382.0" x2="1320.0" y2="382.0" stroke="#D4C9BA" stroke-width="1"/><circle cx="651" cy="344" r="11" fill="#2A2420"/><path d="M647.0 344.5 l3.0 3.0 l5.5 -6.5" fill="none" stroke="#FFFDF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="674.0" y="338.0" class="f" font-size="15" fill="#5E544B">Del 2</text><text x="720.8" y="338.0" class="s" font-size="16" fill="#2A2420" font-weight="600">Lim inn annonse her:</text><text x="1206.0" y="338.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">426 / 15 000 tegn</text><text x="720.8" y="362.0" class="s" font-size="15" fill="#5E544B">Trainee – økonomi og analyse, Nordvik Kraft AS, Ålesund</text><rect x="1234.0" y="326.0" width="86.0" height="36.0" fill="#E4DACB" rx="3"/><text x="1257.5" y="349.2" class="s" font-size="15" fill="#62584F" font-weight="600">Endre</text><g fill="none" stroke="#2A2420" stroke-width="1.5" stroke-linecap="round"><rect x="640" y="422" width="13" height="10" rx="2"/><path d="M643 422 V419.5 a3.5 3.5 0 0 1 7 0 V422"/></g><text x="664.0" y="430.0" class="s" font-size="15" fill="#2A2420">CV-en din sendes til Claude for analyse. Appen lagrer den ikke.</text><rect x="640.0" y="458.0" width="220.0" height="52.0" fill="#E4DACB" rx="3"/><text x="702.2" y="489.6" class="s" font-size="16" fill="#62584F" font-weight="600">Analyserer …</text><text x="880.0" y="482.0" class="s" font-size="14" fill="#5E544B">«Analyser» er deaktivert til svaret kommer, så analysen ikke sendes</text><text x="880.0" y="503.0" class="s" font-size="14" fill="#5E544B">to ganger.</text><line x1="640.0" y1="560.0" x2="1320.0" y2="560.0" stroke="#D4C9BA" stroke-width="1"/><text x="640.0" y="616.0" class="f" font-size="34" fill="#2A2420">Analyserer …</text><text x="640.0" y="654.0" class="s" font-size="16" fill="#5E544B">Appen leser annonsen krav for krav og skriver kapitlene. Dette tar</text><text x="640.0" y="679.0" class="s" font-size="16" fill="#5E544B">vanligvis 15–30 sekunder. Feltene beholder teksten din.</text><text x="640.0" y="740.0" class="f" font-size="20" fill="#5E544B">Innhold</text><line x1="640.0" y1="752.0" x2="1060.0" y2="752.0" stroke="#D4C9BA" stroke-width="1"/><text x="640.0" y="786.0" class="s" font-size="15" fill="#5E544B">Oversikt</text><line x1="701.0" y1="782.0" x2="1020.0" y2="782.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="1060.0" y="786.0" class="f" font-size="15" fill="#5E544B" text-anchor="end">…</text><text x="640.0" y="826.0" class="f" font-size="15" fill="#5E544B">1</text><text x="662.0" y="826.0" class="s" font-size="15" fill="#5E544B">Dette er bra</text><line x1="747.8" y1="822.0" x2="1020.0" y2="822.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="1060.0" y="826.0" class="f" font-size="15" fill="#5E544B" text-anchor="end">…</text><text x="640.0" y="866.0" class="f" font-size="15" fill="#5E544B">2</text><text x="662.0" y="866.0" class="s" font-size="15" fill="#5E544B">Dette kan bli tydeligere</text><line x1="822.7" y1="862.0" x2="1020.0" y2="862.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="1060.0" y="866.0" class="f" font-size="15" fill="#5E544B" text-anchor="end">…</text><text x="640.0" y="906.0" class="f" font-size="15" fill="#5E544B">3</text><text x="662.0" y="906.0" class="s" font-size="15" fill="#5E544B">Dette mangler</text><line x1="763.8" y1="902.0" x2="1020.0" y2="902.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="1060.0" y="906.0" class="f" font-size="15" fill="#5E544B" text-anchor="end">…</text><text x="640.0" y="970.0" class="s" font-size="14" fill="#5E544B" font-style="italic">Sidetallene fylles inn når analysen er ferdig. Tidsgrensen er 60 sekunder.</text><line x1="120.0" y1="1060.0" x2="1320.0" y2="1060.0" stroke="#D4C9BA" stroke-width="1"/><text x="120.0" y="1088.0" class="s" font-size="13" fill="#5E544B">Laget av gruppe G34, IBE160</text><text x="1320.0" y="1088.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">Ingen innlogging. CV og annonse lagres ikke.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1630" viewBox="0 0 1440 1630" role="img" lang="nb"><title>Konsept 12 Kapitler – landingsside og del 1</title><desc>Inputsiden med forord og del 1 aktiv, og annotasjon av del 2 etter innliming.</desc><style>.f{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif}.s{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}</style><rect x="0.0" y="0.0" width="1440.0" height="1630.0" fill="#F6F1E9"/><text x="120.0" y="46.0" class="f" font-size="24" fill="#2A2420">CV-assistenten</text><text x="292.2" y="45.0" class="s" font-size="14" fill="#5E544B">en kort gjennomgang av CV-en din</text><text x="1320.0" y="45.0" class="s" font-size="14" fill="#5E544B" text-anchor="end">Ingen innlogging</text><line x1="120.0" y1="72.0" x2="1320.0" y2="72.0" stroke="#D4C9BA" stroke-width="1"/><text x="120.0" y="152.0" class="f" font-size="50" fill="#2A2420">Se hvor godt</text><text x="120.0" y="210.0" class="f" font-size="50" fill="#2A2420">CV-en din treffer</text><text x="120.0" y="268.0" class="f" font-size="50" fill="#2A2420">annonsen.</text><text x="120.0" y="328.0" class="s" font-size="18" fill="#2A2420">Lim inn CV-en din og én stillingsannonse. Du får en</text><text x="120.0" y="357.0" class="s" font-size="18" fill="#2A2420">match-score og en kort gjennomgang i tre kapitler,</text><text x="120.0" y="386.0" class="s" font-size="18" fill="#2A2420">ett om gangen.</text><line x1="120.0" y1="425.0" x2="520.0" y2="425.0" stroke="#D4C9BA" stroke-width="1"/><text x="120.0" y="469.0" class="f" font-size="24" fill="#2A2420">Forord</text><text x="120.0" y="501.0" class="s" font-size="15" fill="#5E544B">Hvert treff har et sitat fra CV-en som bevis, og koden sjekker</text><text x="120.0" y="525.0" class="s" font-size="15" fill="#5E544B">at sitatet står der ordrett. Hintene peker bare på det du</text><text x="120.0" y="549.0" class="s" font-size="15" fill="#5E544B">allerede har skrevet. Ingen erfaring blir funnet på.</text><text x="120.0" y="595.0" class="f" font-size="17" fill="#2A2420">Innhold i gjennomgangen</text><line x1="120.0" y1="609.0" x2="520.0" y2="609.0" stroke="#2A2420" stroke-width="1"/><text x="120.0" y="643.0" class="s" font-size="15" fill="#2A2420">Oversikt</text><line x1="181.0" y1="639.0" x2="435.8" y2="639.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="643.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">match-score</text><text x="120.0" y="679.0" class="f" font-size="15" fill="#5E544B">1</text><text x="142.0" y="679.0" class="s" font-size="15" fill="#2A2420">Dette er bra</text><line x1="227.8" y1="675.0" x2="473.5" y2="675.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="679.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">truffet</text><text x="120.0" y="715.0" class="f" font-size="15" fill="#5E544B">2</text><text x="142.0" y="715.0" class="s" font-size="15" fill="#2A2420">Dette kan bli tydeligere</text><line x1="302.7" y1="711.0" x2="433.8" y2="711.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="715.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">delvis truffet</text><text x="120.0" y="751.0" class="f" font-size="15" fill="#5E544B">3</text><text x="142.0" y="751.0" class="s" font-size="15" fill="#2A2420">Dette mangler</text><line x1="243.8" y1="747.0" x2="459.5" y2="747.0" stroke="#5E544B" stroke-width="1.4" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="520.0" y="751.0" class="f" font-size="14" fill="#5E544B" font-style="italic" text-anchor="end">mangler</text><text x="640.0" y="160.0" class="f" font-size="30" fill="#2A2420">Din CV og annonsen</text><g fill="none" stroke="#5E544B" stroke-width="1.5" stroke-linecap="round"><circle cx="649" cy="192" r="8"/><path d="M649 191 V196"/></g><circle cx="649" cy="188" r="1.1" fill="#5E544B"/><text x="666.0" y="197.0" class="s" font-size="15" fill="#5E544B">Bare en CV og en annonse per analyse</text><circle cx="651" cy="250" r="10.25" fill="#FFFDF9" stroke="#2A2420" stroke-width="1.5"/><text x="651.0" y="255.0" class="s" font-size="13" fill="#2A2420" font-weight="600" text-anchor="middle">1</text><text x="674.0" y="255.0" class="f" font-size="15" fill="#5E544B">Del 1</text><text x="718.8" y="255.0" class="s" font-size="16" fill="#2A2420" font-weight="600">Lim inn CV her:</text><rect x="640.0" y="274.0" width="680.0" height="270.0" fill="#FFFDF9" stroke="#2A2420" stroke-width="1.5" rx="3"/><text x="662.0" y="304.0" class="s" font-size="15" fill="#5E544B">Lim inn hele CV-en din som tekst.</text><line x1="657.0" y1="289.0" x2="657.0" y2="309.0" stroke="#2A2420" stroke-width="1.5"/><text x="1304.0" y="530.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">0 / 15 000 tegn</text><text x="640.0" y="572.0" class="s" font-size="14" fill="#5E544B">Når du limer inn, slås del 1 sammen til én linje, og del 2 åpnes. Ingen ekstra klikk.</text><line x1="640.0" y1="652.0" x2="1320.0" y2="652.0" stroke="#E6DDD0" stroke-width="1"/><circle cx="651" cy="622" r="10.25" fill="none" stroke="#5E544B" stroke-width="1.5"/><text x="651.0" y="627.0" class="s" font-size="13" fill="#5E544B" font-weight="600" text-anchor="middle">2</text><text x="674.0" y="627.0" class="f" font-size="15" fill="#5E544B">Del 2</text><text x="720.8" y="627.0" class="s" font-size="16" fill="#5E544B" font-weight="600">Lim inn annonse her:</text><text x="1320.0" y="627.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">åpnes etter del 1</text><line x1="640.0" y1="712.0" x2="1320.0" y2="712.0" stroke="#E6DDD0" stroke-width="1"/><circle cx="651" cy="682" r="10.25" fill="none" stroke="#5E544B" stroke-width="1.5"/><text x="651.0" y="687.0" class="s" font-size="13" fill="#5E544B" font-weight="600" text-anchor="middle">3</text><text x="674.0" y="687.0" class="f" font-size="15" fill="#5E544B">Del 3</text><text x="720.5" y="687.0" class="s" font-size="16" fill="#5E544B" font-weight="600">Analyser</text><text x="1320.0" y="687.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">når begge feltene er fylt ut</text><g fill="none" stroke="#2A2420" stroke-width="1.5" stroke-linecap="round"><rect x="640" y="752" width="13" height="10" rx="2"/><path d="M643 752 V749.5 a3.5 3.5 0 0 1 7 0 V752"/></g><text x="664.0" y="760.0" class="s" font-size="15" fill="#2A2420">CV-en din sendes til Claude for analyse. Appen lagrer den ikke.</text><rect x="640.0" y="788.0" width="200.0" height="52.0" fill="#E4DACB" rx="3"/><text x="708.7" y="819.6" class="s" font-size="16" fill="#62584F" font-weight="600">Analyser</text><text x="862.0" y="820.0" class="s" font-size="14" fill="#5E544B">Fyll inn begge feltene for å analysere.</text><line x1="120.0" y1="930.0" x2="1320.0" y2="930.0" stroke="#D4C9BA" stroke-width="1"/><text x="120.0" y="958.0" class="s" font-size="13" fill="#5E544B">Laget av gruppe G34, IBE160</text><text x="1320.0" y="958.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">Ingen innlogging. CV og annonse lagres ikke.</text><rect x="0.0" y="990.0" width="1440.0" height="640.0" fill="#E9EEF2"/><text x="120.0" y="1024.0" class="s" font-size="15" fill="#3E5468" font-weight="600">Annotasjon – samme panel etter at CV-en er limt inn (ikke en del av siden)</text><text x="120.0" y="1046.0" class="s" font-size="14" fill="#3E5468">Del 1 er slått sammen med «Endre», del 2 har fokus. Knappen viser begge tilstandene.</text><rect x="120.0" y="1074.0" width="780.0" height="520.0" fill="#F6F1E9" stroke="#D4C9BA" stroke-width="1" rx="4"/><line x1="160.0" y1="1104.0" x2="860.0" y2="1104.0" stroke="#D4C9BA" stroke-width="1"/><line x1="160.0" y1="1180.0" x2="860.0" y2="1180.0" stroke="#D4C9BA" stroke-width="1"/><circle cx="171" cy="1142" r="11" fill="#2A2420"/><path d="M167.0 1142.5 l3.0 3.0 l5.5 -6.5" fill="none" stroke="#FFFDF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="194.0" y="1136.0" class="f" font-size="15" fill="#5E544B">Del 1</text><text x="238.8" y="1136.0" class="s" font-size="16" fill="#2A2420" font-weight="600">Lim inn CV her:</text><text x="746.0" y="1136.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">357 / 15 000 tegn</text><text x="238.8" y="1160.0" class="s" font-size="15" fill="#5E544B">Yvonne Berg · Bachelor i IT og informasjonssystemer, Høgskolen i Molde</text><rect x="774.0" y="1124.0" width="86.0" height="36.0" fill="#FFFDF9" stroke="#2A2420" stroke-width="1.25" rx="3"/><text x="797.5" y="1147.2" class="s" font-size="15" fill="#2A2420" font-weight="600">Endre</text><circle cx="171" cy="1214" r="10.25" fill="#FFFDF9" stroke="#2A2420" stroke-width="1.5"/><text x="171.0" y="1219.0" class="s" font-size="13" fill="#2A2420" font-weight="600" text-anchor="middle">2</text><text x="194.0" y="1219.0" class="f" font-size="15" fill="#5E544B">Del 2</text><text x="240.8" y="1219.0" class="s" font-size="16" fill="#2A2420" font-weight="600">Lim inn annonse her:</text><rect x="160.0" y="1238.0" width="700.0" height="170.0" fill="#FFFDF9" stroke="#2A2420" stroke-width="1.5" rx="3"/><text x="178.0" y="1268.0" class="s" font-size="15" fill="#2A2420">Trainee – økonomi og analyse, Nordvik Kraft AS, Ålesund</text><text x="178.0" y="1291.0" class="s" font-size="15" fill="#2A2420">Vi søker to traineer til et toårig program.</text><text x="178.0" y="1314.0" class="s" font-size="15" fill="#2A2420">Krav: Bachelorgrad innen økonomi, IT eller tilsvarende. Du må</text><text x="178.0" y="1337.0" class="s" font-size="15" fill="#2A2420">beherske Excel. Vi forventer god skriftlig og muntlig</text><text x="178.0" y="1360.0" class="s" font-size="15" fill="#2A2420">fremstillingsevne. Erfaring med kundekontakt er nødvendig.</text><text x="844.0" y="1394.0" class="s" font-size="13" fill="#5E544B" text-anchor="end">426 / 15 000 tegn</text><g fill="none" stroke="#2A2420" stroke-width="1.5" stroke-linecap="round"><rect x="160" y="1446" width="13" height="10" rx="2"/><path d="M163 1446 V1443.5 a3.5 3.5 0 0 1 7 0 V1446"/></g><text x="184.0" y="1454.0" class="s" font-size="15" fill="#2A2420">CV-en din sendes til Claude for analyse. Appen lagrer den ikke.</text><rect x="160.0" y="1482.0" width="200.0" height="52.0" fill="#2A2420" rx="3"/><text x="228.7" y="1513.6" class="s" font-size="16" fill="#FFFDF9" font-weight="600">Analyser</text><text x="382.0" y="1514.0" class="s" font-size="14" fill="#2A2420">Begge feltene er fylt ut og under 15 000 tegn.</text><text x="960.0" y="1094.0" class="s" font-size="15" fill="#3E5468" font-weight="600">Knappens to tilstander</text><rect x="960.0" y="1114.0" width="200.0" height="52.0" fill="#E4DACB" rx="3"/><text x="1028.7" y="1145.6" class="s" font-size="16" fill="#62584F" font-weight="600">Analyser</text><text x="960.0" y="1194.0" class="s" font-size="14" fill="#3E5468">Deaktivert: et felt er tomt, bare mellomrom, eller over</text><text x="960.0" y="1215.0" class="s" font-size="14" fill="#3E5468">15 000 tegn.</text><rect x="960.0" y="1254.0" width="200.0" height="52.0" fill="#2A2420" rx="3"/><text x="1028.7" y="1285.6" class="s" font-size="16" fill="#FFFDF9" font-weight="600">Analyser</text><text x="960.0" y="1334.0" class="s" font-size="14" fill="#3E5468">Aktiv: begge feltene har tekst innenfor grensen.</text><text x="960.0" y="1404.0" class="s" font-size="15" fill="#3E5468" font-weight="600">Delene som innholdsfortegnelse</text><text x="960.0" y="1428.0" class="s" font-size="14" fill="#3E5468">«Del 1, Del 2, Del 3» erstatter stegindikatoren fra</text><text x="960.0" y="1449.0" class="s" font-size="14" fill="#3E5468">konsept 09. Delene står loddrett som i en</text><text x="960.0" y="1470.0" class="s" font-size="14" fill="#3E5468">innholdsfortegnelse, så du ser hele løpet uten en egen</text><text x="960.0" y="1491.0" class="s" font-size="14" fill="#3E5468">stepper øverst.</text></svg>

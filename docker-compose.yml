# Requires Docker Compose >= 2.24 (optional env_file).
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/status')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      README_PATH: /app/README.md
    volumes:
      - ./README.md:/app/README.md:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

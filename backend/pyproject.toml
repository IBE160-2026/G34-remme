[project]
name = "cvjobb-backend"
version = "0.1.0"
description = "Backend for CV & Jobb applikasjonsassistent"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]==0.163.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "import-linter==2.16",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent of api, analysis and llm"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.api", "app.analysis", "app.llm", "app.config", "app.main"]

[[tool.importlinter.contracts]]
name = "Layers: api > analysis > domain | llm"
type = "layers"
layers = ["app.api", "app.analysis", "app.domain | app.llm"]

[[tool.importlinter.contracts]]
name = "Only app.llm may import anthropic"
type = "forbidden"
source_modules = ["app.api", "app.analysis", "app.domain", "app.config", "app.main"]
forbidden_modules = ["anthropic"]
